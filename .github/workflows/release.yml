name: Release

on:
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build and test
        run: ./gradlew --no-daemon test :velocity:shadowJar

      - name: Upload Velocity plugin
        uses: actions/upload-artifact@v4
        with:
          name: NanoLimboPluginPlus-Velocity
          path: velocity/build/libs/NanoLimboPluginPlus-Velocity-*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Velocity plugin
        uses: actions/download-artifact@v4
        with:
          name: NanoLimboPluginPlus-Velocity
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          JAR=$(ls dist/*.jar)
          VERSION=$(basename "$JAR" | sed -E 's/^NanoLimboPluginPlus-Velocity-(.*)\.jar$/\1/')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" \
              --title "NanoLimbo Velocity $VERSION" \
              --notes "Built from $GITHUB_SHA on Java 21."
          fi
