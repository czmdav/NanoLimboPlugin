name: Release

on:
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build and test
        run: ./gradlew --no-daemon test :velocity:shadowJar :api:shadowJar

      - name: Upload Velocity plugin
        uses: actions/upload-artifact@v4
        with:
          name: NanoLimboPlus-Velocity
          path: velocity/build/libs/NanoLimboPlus-Velocity-*.jar
          if-no-files-found: error

      - name: Upload standalone server
        uses: actions/upload-artifact@v4
        with:
          name: NanoLimboPlus-standalone
          path: api/build/libs/NanoLimboPlus-standalone-*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: NanoLimboPlus-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VELOCITY_JAR=$(ls dist/NanoLimboPlus-Velocity-*.jar)
          STANDALONE_JAR=$(ls dist/NanoLimboPlus-standalone-*.jar)
          VERSION=$(basename "$VELOCITY_JAR" | sed -E 's/^NanoLimboPlus-Velocity-(.*)\.jar$/\1/')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VELOCITY_JAR" "$STANDALONE_JAR" --clobber
          else
            gh release create "$TAG" "$VELOCITY_JAR" "$STANDALONE_JAR" --target "$GITHUB_SHA" \
              --title "NanoLimboPlus $VERSION" \
              --notes "Built from $GITHUB_SHA on Java 25."
          fi
